# Despliegue en Railway.
# Railway detecta uv (por uv.lock) y sincroniza el workspace en el build.
# El app Django vive en la subcarpeta seguimiento_poai, por eso los comandos
# usan `uv run --directory seguimiento_poai`.

[build]
builder = "nixpacks"
# Los estaticos se recolectan en el build: lo que queda en la imagen es lo que ve el
# contenedor que atiende. El preDeployCommand corre en un contenedor aparte y lo que
# escribe en disco se pierde; recolectados ahi, con DEBUG=False faltaba el manifiesto de
# WhiteNoise y toda pagina caia con "Missing staticfiles manifest entry". No necesita
# SECRET_KEY ni base de datos.
buildCommand = "uv run --directory seguimiento_poai python manage.py collectstatic --noinput"

[deploy]
# Antes de exponer la version nueva: aplica las migraciones en Supabase.
preDeployCommand = "uv run --directory seguimiento_poai python manage.py migrate --noinput"

# Servidor de produccion. Railway inyecta $PORT.
startCommand = "uv run --directory seguimiento_poai gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"

restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
