[project]
name = "siifweb-app"
version = "0.1.0"
requires-python = ">=3.12"
# Dependencias del analisis (parquet, conciliaciones). La app oficial es el
# proyecto Django del workspace: seguimiento_poai.
dependencies = [
    "dj-database-url>=3.1.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "psycopg2>=2.9.12",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.workspace]
members = [
    "seguimiento_poai",
]
